{% extends "blog/base.html" %}
{% block title %}{{ user.author }}{% endblock %}

{% block content %}
<div class="card">
    <div class="card-body">
        <h1 class="card-title h2">{{ user.author }}</h1>
        <p class="text-muted">
            {{ author.username }}, ID: {{ author.id }}
        </p>
        <hr>
        {{ post.body|linebreaks }}
    </div>
</div>

<div class="mt-3">
    <a href="{% url 'blog:post_list' %}" class="btn btn-outline-secondary">
        ← Назад
    </a>
</div>
{% endblock %}
